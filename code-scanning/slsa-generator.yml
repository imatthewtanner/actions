# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow generates SLSA provenance for your project.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA Generator

on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]
  schedule:
    - cron: $cron-weekly

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Build your artifacts
      # ========================================================
      # Replace this section with your actual build process.
      # This example creates placeholder artifacts for demo.
      # ========================================================
      - name: Build artifacts
        run: |
          # Replace these echo commands with your actual build steps
          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      # Step 2: Generate provenance subjects
      # ========================================================
      # This step generates the base64-encoded hashes of your
      # artifacts that will be included in the provenance file.
      # Update the sha256sum arguments to include all binaries.
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to
          files=$(ls artifact*)
          
          # Generate the subjects (base64 encoded)
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    name: Generate provenance
    needs: [build]
    permissions:
      actions: read       # To read the workflow path
      id-token: write     # To sign the provenance
      contents: write     # To add assets to a release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
